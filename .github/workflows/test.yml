name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: functions/package.json
          cache: npm
          cache-dependency-path: functions/package-lock.json
      # The Firestore emulator needs Java 21+.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # Also builds lib/ through the prepare script.
      - run: npm ci
        working-directory: functions
      - run: npx -y firebase-tools@15 emulators:exec --only firestore,auth --project=demo-revenuecat 'cd functions && npm test'
